services:
  mongo:
    image: mongo:7
    container_name: devsentry-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - devsentry_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
    container_name: devsentry-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    environment:
      PORT: 5000
      MONGODB_URI: ${DOCKER_MONGODB_URI:-mongodb://mongo:27017/devsentry}
      SEMGREP_MODE: local

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: devsentry-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"

  selenium:
    build:
      context: .
      dockerfile: tests/selenium/Dockerfile
    profiles: ["test"]
    depends_on:
      client:
        condition: service_healthy
    command: ["--base-url", "http://client"]

volumes:
  devsentry_mongo_data:
